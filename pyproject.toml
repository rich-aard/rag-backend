[project]
name = "rag-backend"
version = "0.1.0"
description = "FastAPI backend with a document ingestion API and a conversational RAG API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.2",
    "tiktoken>=0.14.0",
    "tzdata>=2026.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]
